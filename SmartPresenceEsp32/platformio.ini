; SmartPresence — lecteur biométrique ESP32
;
; Cible par défaut : ESP32 DevKit v1 (ESP32-WROOM-32, 4 Mo de flash). Une seconde cible,
; env:esp32s3, vise la carte ESP32-S3-DevKitC-1 N16R8 (voir plus bas).
; Toute autre carte ESP32 convient à condition de revoir le brochage de config.h.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Le schéma par défaut réserve deux partitions applicatives pour la mise à jour à
; distance, et n'en laisse qu'1,31 Mo à l'application — dont ce firmware occupe déjà
; les trois quarts. Faute d'OTA ici, une partition unique de 3 Mo libère la marge
; nécessaire aux évolutions, sans rien retirer.
board_build.partitions = huge_app.csv

; Le moniteur série décode les traces d'exception : sans ce filtre, un plantage
; n'affiche qu'une suite d'adresses hexadécimales inexploitable.
monitor_filters = esp32_exception_decoder, time

build_flags =
	-D CORE_DEBUG_LEVEL=2
	; Les identifiants ne figurent pas dans le dépôt. Copiez identifiants.exemple.h
	; en identifiants.h et renseignez-les : ce fichier est ignoré par git.
	-D SMARTPRESENCE_AVEC_IDENTIFIANTS_LOCAUX

lib_deps =
	; Dialogue avec le capteur d'empreintes AS608 en UART.
	adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
	; Horloge temps réel DS3231, qui conserve l'heure hors tension.
	adafruit/RTClib @ ^2.1.4
	; Afficheur OLED SSD1306 128x64 en I2C.
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	; Sérialisation des lots envoyés au serveur.
	bblanchon/ArduinoJson @ ^7.0.4


; ---------------------------------------------------------------------------
; Cible alternative : ESP32-S3-DevKitC-1 N16R8 (16 Mo de flash, 8 Mo de PSRAM octale)
; ---------------------------------------------------------------------------
;
; Le brochage de cette carte diffère de celui de l'ESP32 classique : voir la section
; ESP32-S3 de src/config.h et le dossier Branchement-ESP32-S3/.
;
; Compilation : pio run -e esp32s3      Téléversement : pio run -e esp32s3 -t upload
;
; Le moniteur série passe par le connecteur USB marqué « UART » (puce CH343), qui est
; aussi celui du téléversement. Le connecteur « USB » (natif) n'est pas utilisé : le
; port série y est émulé par l'ESP32 lui-même et disparaît à chaque redémarrage.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; N16R8 = flash 16 Mo en mode quad, PSRAM 8 Mo en mode octal. Un type de mémoire
; erroné ne donne pas d'erreur de compilation : la carte boucle au démarrage sur
; « Octal PSRAM / flash id ». Ces trois lignes doivent donc rester ensemble.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio

; Schéma 16 Mo avec deux partitions applicatives : la mise à jour à distance devient
; possible sans rien changer ici, et la place ne manque plus.
board_build.partitions = default_16MB.csv

monitor_filters = esp32_exception_decoder, time

build_flags =
	-D CORE_DEBUG_LEVEL=2
	-D SMARTPRESENCE_AVEC_IDENTIFIANTS_LOCAUX
	; La PSRAM est déclarée pour que la pile l'initialise au démarrage ; ce firmware
	; n'en a pas besoin, mais une carte N16R8 qui ne l'initialise pas la laisse
	; inutilisable pour la suite.
	-D BOARD_HAS_PSRAM

lib_deps =
	adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
	adafruit/RTClib @ ^2.1.4
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	bblanchon/ArduinoJson @ ^7.0.4
